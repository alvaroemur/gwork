[project]
name = "gwork"
version = "0.2.0"
description = "Sync local Markdown and CSV files with Google Docs and Sheets"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "pypandoc>=1.13",
    "click>=8.1",
    "rich>=13.7",
]

[project.scripts]
gwork = "gwork.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
