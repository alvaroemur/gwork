<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>cowork-drivesync · arquitectura</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 20px; background: #fafafa; color: #222; }
    h1 { margin-bottom: 6px; }
    .sub { color: #666; margin-bottom: 16px; }
    nav button { font-size: 13px; padding: 6px 12px; margin-right: 6px; cursor: pointer;
                 border: 1px solid #ccc; background: #fff; border-radius: 4px; }
    nav button.active { background: #222; color: #fff; border-color: #222; }
    #diagram { background: #fff; border: 1px solid #e3e3e3; border-radius: 6px;
               padding: 20px; min-height: 300px; margin-top: 14px; overflow: auto; }
    .err { color: #b00; padding: 12px; white-space: pre-wrap; font-family: monospace; }
  </style>
</head>
<body>
  <h1>cowork-drivesync</h1>
  <div class="sub">arquitectura, modelo de datos y procedimiento</div>
  <nav id="nav"></nav>
  <div id="diagram">Cargando…</div>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "loose" });

    const DIAGRAMS = [
      { id: "l1",        label: "Nivel 1 · DFD",            file: "arquitectura.mmd" },
      { id: "er",        label: "ER · modelo de datos",     file: "er.mmd" },
      { id: "planapply", label: "Nivel 2 · plan → apply",   file: "arquitectura-plan-apply.mmd" },
    ];

    function currentId() {
      const h = location.hash.replace(/^#/, "");
      return DIAGRAMS.some(d => d.id === h) ? h : DIAGRAMS[0].id;
    }
    async function load() {
      const d = DIAGRAMS.find(x => x.id === currentId());
      document.querySelectorAll("nav button").forEach(b =>
        b.classList.toggle("active", b.dataset.id === d.id));
      try {
        const res = await fetch(d.file + "?ts=" + Date.now());
        if (!res.ok) throw new Error("HTTP " + res.status);
        const src = await res.text();
        const { svg } = await mermaid.render("arq-" + Date.now(), src);
        document.getElementById("diagram").innerHTML = svg;
      } catch (e) {
        document.getElementById("diagram").innerHTML =
          `<div class="err">No pude renderizar ${d.file}: ${e.message}</div>`;
      }
    }
    const nav = document.getElementById("nav");
    DIAGRAMS.forEach(d => {
      const b = document.createElement("button");
      b.textContent = d.label; b.dataset.id = d.id;
      b.onclick = () => { location.hash = d.id; };
      nav.appendChild(b);
    });
    window.addEventListener("hashchange", load);
    load();
  </script>
</body>
</html>
